<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Hommar 土量計算機</title>
<style>
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #ffffff;
    margin: 0;
    padding: 0;
    color: #333;
  }

  .container {
    background: #ffffff;
    padding: 25px;
    border-radius: 14px;
    max-width: 480px;
    margin: 30px auto;
    border: 1px solid #f0f0f0;
  }

  h2 {
    text-align: center;
    margin-bottom: 10px;
    color: #ff7b00;
    font-weight: 700;
  }

  label {
    font-weight: 600;
    margin-top: 15px;
    display: block;
    color: #555;
  }

  input, select {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    margin-top: 6px;
    border-radius: 8px;
    border: 1px solid #ddd;
    background: #fafafa;
    color: #333;
  }

  button {
    width: 100%;
    padding: 14px;
    font-size: 18px;
    margin-top: 25px;
    background: #ff7b00;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
  }

  button:hover {
    background: #e66d00;
  }

  #result {
    margin-top: 25px;
    background: #fff7ef;
    padding: 20px;
    border-radius: 12px;
    border: 1px solid #ffe0c2;
  }

  .line {
    margin-top: 8px;
    font-size: 17px;
    color: #333;
  }

  /* ▼ ロゴを下部中央に、余白があっても切れないようにする */
  footer {
    width: 100%;
    text-align: center;
    padding: 10px 0 20px 0; /* ← ロゴ位置を少し上に */
    margin-top: 40px;       /* ← 計算ボタンとの間に余白を確保 */
  }

  footer img {
    width: 80%;        /* ← 幅フィット */
    max-width: 350px;  /* ← PCで大きすぎないように */
    height: auto;
    display: block;
    margin: 0 auto;
  }
</style>
</head>
<body>

<div class="container">
  <h2>土量計算機</h2>
  <p style="text-align:center;color:#777;">面積・深さ・土質から土量とダンプ台数を自動計算</p>

  <label>面積（㎡）</label>
  <input id="area" type="number" placeholder="例：120">

  <label>深さ（m）</label>
  <input id="depth" type="number" step="0.01" placeholder="例：0.5">

  <label>土質（比重が自動設定されます）</label>
  <select id="soil" onchange="setDensity()">
    <option value="1.7">砕石（1.7 t/㎥）</option>
    <option value="1.6">砂（1.6 t/㎥）</option>
    <option value="1.4">赤土（1.4 t/㎥）</option>
    <option value="1.2">表土（1.2 t/㎥）</option>
    <option value="1.5">粘土（1.5 t/㎥）</option>
  </select>

  <label>比重（t/㎥）</label>
  <input id="density" type="number" step="0.1" value="1.7">

  <button onclick="calc()">計算する</button>

  <div id="result"></div>
</div>

<footer>
  <img src="hommar-logo.png" alt="Hommar ロゴ">
</footer>

<script>
function setDensity() {
  const density = document.getElementById("soil").value;
  document.getElementById("density").value = density;
}
